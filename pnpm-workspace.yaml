packages:
  - apps/*
  - packages/*
  - packages/core/*
  - packages/platform/*
  - packages/infrastructure/*
overrides:
  'axios@>=1.15.2 <1.18.0': 1.18.1
  'brace-expansion@<=5.0.7': 5.0.8
  'find-my-way@<=9.6.0': 9.7.0

auditConfig:
  ignoreGhsas:
    # Temporary, narrowly scoped exceptions for advisories published after the
    # current lockfile. Tracked for forced transitive upgrades in issues #43 and #45.
    - GHSA-7p8r-x3mc-p8w7
    - GHSA-rgw5-rvv9-x895
    - GHSA-5p4m-2wfm-xmqj
    # @prisma/config 7.9.1 pins deepmerge-ts 7.1.5; tracked upstream in prisma/prisma#30052.
    - GHSA-ggr8-5vv4-36mx

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  nx: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@prisma/adapter-pg@7.9.1'
  - '@prisma/client-runtime-utils@7.9.1'
  - '@prisma/client@7.9.1'
  - '@prisma/config@7.9.1'
  - '@prisma/debug@7.9.1'
  - '@prisma/dev@0.24.17'
  - '@prisma/driver-adapter-utils@7.9.1'
  - '@prisma/engines@7.9.1'
  - '@prisma/fetch-engine@7.9.1'
  - '@prisma/get-platform@7.9.1'
  - prisma@7.9.1
