packages:
  - apps/*
  - packages/*
  - packages/core/*
  - packages/platform/*
  - packages/infrastructure/*

overrides:
  'axios@>=1.15.2 <1.18.0': 1.18.1
  'brace-expansion@<=5.0.7': 5.0.8
  'find-my-way@<=9.6.0': 9.7.0

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  nx: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@prisma/adapter-pg@7.9.1'
  - '@prisma/client-runtime-utils@7.9.1'
  - '@prisma/client@7.9.1'
  - '@prisma/config@7.9.1'
  - '@prisma/debug@7.9.1'
  - '@prisma/dev@0.24.17'
  - '@prisma/driver-adapter-utils@7.9.1'
  - '@prisma/engines@7.9.1'
  - '@prisma/fetch-engine@7.9.1'
  - '@prisma/get-platform@7.9.1'
  - prisma@7.9.1
