name: Temporary format external orders

on:
  push:
    branches:
      - feat/external-order-inbox-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-order-inbox-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/business/sales/src/application/external-order-inbox.ts packages/infrastructure/database/src/prisma-external-order-inbox.repository.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet --exit-code; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/business/sales/src/application/external-order-inbox.ts packages/infrastructure/database/src/prisma-external-order-inbox.repository.ts
          git commit -m "style(orders): format external order inbox"
          git push origin HEAD:feat/external-order-inbox-v2
