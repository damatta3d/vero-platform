name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vero-manager-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma validate
      - run: pnpm audit --audit-level high
      - name: Normalize Manager v2 formatting
        run: |
          pnpm exec prettier --write apps/api/src/menu/menu-admin.controller.ts apps/manager/src/main.js
          pnpm exec prettier --write apps/api/src/menu/menu-admin.controller.ts apps/manager/src/main.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/menu/menu-admin.controller.ts apps/manager/src/main.js
          if ! git diff --cached --quiet; then
            git commit -m "style(manager): normalize formatting"
            git push origin HEAD:feat/vero-manager-v2
          fi
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vero
          POSTGRES_PASSWORD: vero-ci
          POSTGRES_DB: vero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vero -d vero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: vero
          RABBITMQ_DEFAULT_PASS: vero-ci
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
      VERO_REDIS_URL: redis://localhost:6379
      VERO_RABBITMQ_URL: amqp://vero:vero-ci@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:integration
