name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma validate
      - run: |
          bash -n infrastructure/hostinger/deploy.sh
          bash -n infrastructure/hostinger/smoke-test.sh
      - name: Validate migration recovery guard exit semantics
        run: |
          grep -Fq '[[ "${migration_table}" == '\''_prisma_migrations'\'' ]] || return 0' infrastructure/hostinger/deploy.sh
          grep -Fq '[[ "${failed}" == '\''1'\'' ]] || return 0' infrastructure/hostinger/deploy.sh
      - name: Validate production Caddyfile
        run: |
          docker run --rm \
            -e VERO_PUBLIC_SITE=:80 \
            -v "$PWD/infrastructure/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -e VERO_PUBLIC_SITE=vero.example.com \
            -v "$PWD/infrastructure/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: pnpm audit --audit-level high
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vero
          POSTGRES_PASSWORD: vero-ci
          POSTGRES_DB: vero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vero -d vero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: vero
          RABBITMQ_DEFAULT_PASS: vero-ci
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
      VERO_REDIS_URL: redis://localhost:6379
      VERO_RABBITMQ_URL: amqp://vero:vero-ci@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm nx build api --skip-nx-cache
      - run: pnpm test:integration
