name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma validate
      - run: pnpm audit --audit-level high
      - name: Capture formatted Manager v2 files
        run: |
          pnpm exec prettier --write apps/api/src/menu/menu-admin.controller.ts apps/manager/src/index.html apps/manager/src/main.js apps/manager/src/styles.css
          mkdir -p prettier-output/apps/api/src/menu prettier-output/apps/manager/src
          cp apps/api/src/menu/menu-admin.controller.ts prettier-output/apps/api/src/menu/
          cp apps/manager/src/index.html apps/manager/src/main.js apps/manager/src/styles.css prettier-output/apps/manager/src/
      - uses: actions/upload-artifact@v4
        with:
          name: manager-v2-prettier
          path: prettier-output
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vero
          POSTGRES_PASSWORD: vero-ci
          POSTGRES_DB: vero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vero -d vero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: vero
          RABBITMQ_DEFAULT_PASS: vero-ci
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERO_DATABASE_URL: postgresql://vero:vero-ci@localhost:5432/vero
      VERO_REDIS_URL: redis://localhost:6379
      VERO_RABBITMQ_URL: amqp://vero:vero-ci@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:integration
